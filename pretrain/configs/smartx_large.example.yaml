# Pretraining initialized from SmartX.
base_dir: "${SMARTX_OUTPUT_DIR:-experiments}"

model: smartx_large
img_size: 768
in_chans: 3
patch_size: 16
vision_encoder_name: "smartx_large"
vision_encoder_dim: 1536
vision_encoder_depth: 12
vision_encoder_num_heads: 12
vision_encoder_mlp_ratio: 4
vision_encoder_drop_path_rate: 0.1
smartx_checkpoint: "${SMARTX_CHECKPOINT:-auto}"
wandb_mode: disabled

text_encoder_name: "pubmedbert"
text_freeze_layers: 0
output_dim: 512

seed: 42
ddp_find_unused_parameters: false
vision_lr: 2e-4
text_lr: 7e-4
scale_lr: false
vision_layer_decay: 0.75
text_layer_decay: 0.8
weight_decay: 1e-8
projection_warmup_epochs: 1
warmup_epochs: 5
encoder_warmup_epochs: 7
local_alignment_transition_epochs: 1
local_alignment_transition_mix_loss: false
transition_encoder_lr_scale: 0.5
transition_encoder_lr_ramp: true
max_epochs: 50
batch_size: 72  # Per GPU; 16 GPUs give global batch size 1152.

global_loss: "siglip_all_gather"
gradient_clip_val: 1
accumulate_grad_batches: 1
attn_temp: 4.0
text_agg_temp: 5.0
final_temp: 10.0
accumulate_ratio: 0.9

log_image_freq: 100
log_train_similarity: false
log_every_n_steps: 10

max_views: 1
max_regions: 16
region: ["Chest", "Pelvis", "Wrist", "Metacarpal", "Lumbar_spine", "Cervical_spine", "Foot", "Ankle", "Abdominal", "Knee"]
chexpert_data_dir: "${SMARTX_DATA_ROOT}/CheXpert-Plus"
padchest_data_dir: "${SMARTX_DATA_ROOT}/PadChest"
mimic_data_dir: "${SMARTX_DATA_ROOT}/MIMIC-CXR"
rexgradient_data_dir: "${SMARTX_DATA_ROOT}/ReXGradient-160K"
expand_samples: true

smoke_test: false
smoke_test_max_train_samples: 2000
smoke_test_max_val_samples: 2000
smoke_test_max_epochs: 10
