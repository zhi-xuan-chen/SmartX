model:
  name: smartx_large
  checkpoint: ${SMARTX_CHECKPOINT}
  repo_id: Trusure/SmartX
  filename: smartx_large.ckpt

dataset:
  name: xray_example
  split: test
  task_type: multi-label
  class_names:
    - normal
    - pneumonia
    - fracture
  image_root: ${SMARTX_DATA_ROOT}/images
  manifest: ${SMARTX_DATA_ROOT}/zero_shot_classification/test.csv
  image_column: image_path
  label_column: labels
  verify_images: false

prompts:
  positive_templates:
    - "This X-ray demonstrates {class_name}."
    - "The radiograph shows evidence of {class_name}."
  negative_templates:
    - "This X-ray does not show {class_name}."
    - "The radiograph shows no evidence of {class_name}."

evaluation:
  output_dir: outputs/zero_shot_classification/xray_example
  image_size: 768
  in_channels: 3
  batch_size: 16
  num_workers: 4
