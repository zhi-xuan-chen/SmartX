model:
  name: smartx_large
  checkpoint: ${SMARTX_CHECKPOINT}
  repo_id: Trusure/SmartX
  filename: smartx_large.ckpt

dataset:
  name: public_xray_example
  task_type: multi-label
  num_classes: 3
  class_names:
    - normal
    - pneumonia
    - fracture
  image_root: ${SMARTX_DATA_ROOT}/images
  manifests:
    train: ${SMARTX_DATA_ROOT}/linear_probe/train.csv
    valid: ${SMARTX_DATA_ROOT}/linear_probe/valid.csv
    test: ${SMARTX_DATA_ROOT}/linear_probe/test.csv
  image_column: image_path
  label_column: labels
  verify_images: false

feature_extraction:
  output_dir: outputs/linear_probe/features/smartx_large
  image_size: 768
  in_channels: 3
  batch_size: 16
  num_workers: 4
  splits: [train, valid, test]

features:
  dir: outputs/linear_probe/features/smartx_large

training:
  output_dir: outputs/linear_probe/run
  batch_size: 128
  max_epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.0
  monitor: auc_macro
  seed: 42

evaluation:
  output_dir: outputs/linear_probe/eval
  batch_size: 256
  splits: [test]
