dataset_name: zsfs

# 评估相关（会复用 checkpoint 中保存的 feature_dim / disease_cols）
batch_size: 8
num_workers: 8
max_views: 6
img_size: 224
in_channels: 3
preload_features: true

# 占位训练超参（测试脚本不会实际使用训练流程）
lr: 1e-3
weight_decay: 1e-4
max_epochs: 1
warmup_epochs: 0
gradient_clip_val: 1.0
dropout: 0.1
attn_hidden_dim: 256
seed: 42

